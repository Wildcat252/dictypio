<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dictypio">
  <defs>
    <linearGradient id="dictypioTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="dictypioMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0fbff"/>
    </linearGradient>
    <filter id="dictypioGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bioluminescent tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dictypioTile)"/>
  <!-- Inner light from the top edge, matching the Deep Sea surfaces -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none"
        stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>

  <g filter="url(#dictypioGlow)">
    <!-- Stem: three pills reading as one bar at a glance, a waveform up close -->
    <rect x="16" y="12" width="13" height="11.5" rx="5.5" fill="url(#dictypioMark)"/>
    <rect x="16" y="26.25" width="13" height="11.5" rx="5.5" fill="url(#dictypioMark)"/>
    <rect x="16" y="40.5" width="13" height="11.5" rx="5.5" fill="url(#dictypioMark)"/>

    <!-- Bowl of the D -->
    <path fill="url(#dictypioMark)" fill-rule="evenodd"
          d="M29 12h5c12.7 0 20 8.6 20 20s-7.3 20-20 20h-5V41.5h5c6.1 0 9.8-3.9 9.8-9.5s-3.7-9.5-9.8-9.5h-5V12z"/>
  </g>
</svg>
