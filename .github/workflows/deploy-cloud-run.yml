# Deploy the web app to Google Cloud Run on every push to main.
# Auth is keyless (Workload Identity Federation): the provider only accepts
# tokens from Wildcat252/dictypio on refs/heads/main.
# Env vars and secrets stay as set on the service; this only ships new code.
name: Deploy Cloud Run and Firebase Hosting

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: project-3b8da5db-0980-48be-ad7
  REGION: asia-southeast1
  SERVICE: dictypio
  PROJECT_NUMBER: "407335272998"
  # Lesson audio lives here, mounted into the service (see "Ensure audio bucket").
  AUDIO_BUCKET: project-3b8da5db-0980-48be-ad7-audio

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/407335272998/locations/global/workloadIdentityPools/github/providers/dictypio
          service_account: github-deployer@project-3b8da5db-0980-48be-ad7.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Lesson audio must outlive an instance: /tmp on Cloud Run is that
      # instance's memory, gone after every deploy or scale-to-zero. Create the
      # bucket once and let the service's runtime account use it. Idempotent.
      # Without the rights for it the deploy still goes ahead, unmounted, and
      # says what is missing (see backend/README.md).
      - name: Ensure audio bucket
        id: bucket
        run: |
          set -u
          fail() {
            echo "::warning::$1 Lesson audio is NOT on a bucket and is lost on every new instance. Grant github-deployer the role Storage Admin (backend/README.md) and run this workflow again."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if ! gcloud storage buckets describe "gs://$AUDIO_BUCKET" --project "$PROJECT_ID" >/dev/null 2>err.txt; then
            if grep -qiE "not found|404" err.txt; then
              gcloud storage buckets create "gs://$AUDIO_BUCKET" --project "$PROJECT_ID" \
                --location "$REGION" --uniform-bucket-level-access \
                || fail "Could not create the bucket gs://$AUDIO_BUCKET."
              echo "Created gs://$AUDIO_BUCKET"
            else
              cat err.txt
              fail "Could not read the bucket gs://$AUDIO_BUCKET."
            fi
          else
            echo "gs://$AUDIO_BUCKET exists"
          fi
          sa=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          sa=${sa:-$PROJECT_NUMBER-compute@developer.gserviceaccount.com}
          gcloud storage buckets add-iam-policy-binding "gs://$AUDIO_BUCKET" \
            --member "serviceAccount:$sa" --role roles/storage.objectAdmin >/dev/null \
            || fail "Could not let $sa use gs://$AUDIO_BUCKET."
          echo "$sa may use gs://$AUDIO_BUCKET"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          BUCKET_OK: ${{ steps.bucket.outputs.ok }}
        run: |
          audio_flags=()
          if [ "$BUCKET_OK" = "true" ]; then
            audio_flags=(
              --execution-environment gen2
              --add-volume "name=audio,type=cloud-storage,bucket=$AUDIO_BUCKET"
              --add-volume-mount "volume=audio,mount-path=/mnt/audio"
              --update-env-vars EAR2FINGER_AUDIO_DIR=/mnt/audio
            )
          fi
          # An import downloads with yt-dlp inside the request; give it room.
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --timeout 900 \
            "${audio_flags[@]}" \
            --quiet

  # The frontend on Firebase Hosting (dictypio.web.app). Independent of the
  # backend Docker build, so it deploys in parallel. It calls the Cloud Run
  # API cross-origin; CORS_EXTRA_ORIGINS on the service allows it.
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://dictypio-407335272998.asia-southeast1.run.app
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/407335272998/locations/global/workloadIdentityPools/github/providers/dictypio
          service_account: github-deployer@project-3b8da5db-0980-48be-ad7.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project dictypio --non-interactive
